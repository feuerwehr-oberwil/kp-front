overrides:
  # jsPDF pulls DOMPurify transitively. Keep the patched floor here rather than in
  # package.json: pnpm 10 ignores the legacy package.json `pnpm.overrides` field.
  # 3.4.16: GHSA-p98j-92pf-mc4p + GHSA-6688-9rhm-gjv2 (IN_PLACE mode, low).
  # 3.4.17: GHSA-cg2g-xh64-v4q7 (SAFE_FOR_TEMPLATES bypass, critical) + GHSA-mrv2-3pqr-j5jr
  # (IN_PLACE hook, high), 22.10.2026.
  dompurify: ">=3.4.17"
  # Build/dev tooling only (eslint › minimatch, vite-plugin-pwa › workbox-build): patched floors
  # for GHSA DoS advisories of 30.09.2026 until the parents ship them.
  brace-expansion@2: "^2.1.7"
  brace-expansion@5: "^5.0.12"
  fast-uri@3: "^3.1.8"
  # Build tooling only (vite/postcss › source-map-js): GHSA-68fv-2mgg-jv7q event-loop DoS of
  # 06.10.2026, patched in 1.2.2.
  source-map-js: ">=1.2.2"

# ── Audit exceptions ────────────────────────────────────────────────────────────
# One advisory, one reason, one expiry — the rule ci.yml states for any exception. Add them as
# `auditConfig: ignoreGhsas: [GHSA-…]`, the reason beside each entry. Currently none
# (GHSA-jrc7-96c5-q579 went with maplibre-gl 6, #193).

# openapi-typescript 7 declares typescript ^5. It only writes src/lib/api/schema.d.ts (`just
# openapi`) and runs fine on 6 (checked 23.10.2026); drop this once it declares 6.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"
