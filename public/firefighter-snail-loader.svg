<svg xmlns="http://www.w3.org/2000/svg" viewBox="360 20 820 680" fill="none" role="img" aria-labelledby="fs-title fs-desc" class="firefighter-snail fs-arrival">
  <title id="fs-title">Firefighter snail loading animation</title>
  <desc id="fs-desc">A smiling firefighter snail races in, skids to a stop, then nods, rocks its shell, lifts its hose and blinks in place.</desc>
  <!-- Hand-redrawn vectors from the supplied reference. No bitmap, script, font or external resource.
       Inline: add snail-paused or snail-static to the SVG to pause or disable motion.
       The arrival lasts 630 ms; the standing idle repeats every 1.6 seconds. -->
  <style>
    .snail-loader { width: 120px; height: auto; }
    .snail-loader > .firefighter-snail { display: block; width: 100%; height: auto; overflow: visible; }
    :root[data-theme="night"] .snail-loader { filter: drop-shadow(0 0 5px rgba(255, 240, 207, .12)); }
    .firefighter-snail { --snail-arrival-duration: 630ms; --snail-idle-duration: 1.6s; }
    .firefighter-snail.fs-arrival { transform-origin: 65% 85%; animation: fs-arrival var(--snail-arrival-duration) linear both; }
    .firefighter-snail .fs-speed-lines { opacity: 0; animation: fs-speed-lines var(--snail-arrival-duration) linear both; }
    .firefighter-snail .fs-shell { transform-origin: 620px 530px; animation: fs-shell var(--snail-idle-duration) ease-in-out var(--snail-arrival-duration) infinite; }
    .firefighter-snail .fs-head { transform-origin: 800px 535px; animation: fs-brake var(--snail-arrival-duration) ease-out both, fs-head var(--snail-idle-duration) ease-in-out var(--snail-arrival-duration) infinite; }
    .firefighter-snail .fs-nozzle { transform-origin: 891px 551px; animation: fs-nozzle var(--snail-idle-duration) ease-in-out var(--snail-arrival-duration) infinite; }
    .firefighter-snail .fs-eyes { transform-origin: 916px 292px; animation: fs-blink calc(var(--snail-idle-duration) * 2) linear var(--snail-arrival-duration) infinite; }
    @keyframes fs-arrival {
      0% { transform: translateX(calc(-50vw - 120px)) scale(1.18, .92); animation-timing-function: linear; }
      22.222% { transform: translateX(-25px) scale(1.08, .96); animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
      44.444% { transform: translateX(14px) scale(.91, 1.04); animation-timing-function: cubic-bezier(.3, 0, .2, 1); }
      100% { transform: translateX(0) scale(1, 1); }
    }
    @keyframes fs-brake { 0%, 100% { transform: rotate(0); } 27.778%, 44.444% { transform: rotate(7deg); } }
    @keyframes fs-speed-lines { 0%, 16.667% { opacity: .6; } 44.444%, 100% { opacity: 0; } }
    @keyframes fs-shell { 0%, 100% { transform: translate(0, 0) rotate(0); } 35% { transform: translate(-4px, 3px) rotate(-3deg); } 70% { transform: translate(5px, -5px) rotate(3deg); } }
    @keyframes fs-head { 0%, 100% { transform: rotate(0); } 35% { transform: rotate(5deg); } 70% { transform: rotate(-3deg); } }
    @keyframes fs-nozzle { 0%, 100% { transform: rotate(0); } 35% { transform: rotate(2.5deg); } 70% { transform: rotate(-4deg); } }
    @keyframes fs-blink { 0%, 40%, 46%, 100% { transform: scaleY(1); } 43% { transform: scaleY(.08); } }
    .firefighter-snail.snail-paused, .firefighter-snail.snail-paused * { animation-play-state: paused !important; }
    .firefighter-snail.snail-static, .firefighter-snail.snail-static * { animation: none !important; }
    @media (prefers-reduced-motion: reduce) { .firefighter-snail, .firefighter-snail * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="fs-red" x1="560" y1="210" x2="750" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="color-mix(in srgb, var(--accent, #f51b19), white 10%)"/><stop offset=".55" stop-color="var(--accent, #f51b19)"/><stop offset="1" stop-color="color-mix(in srgb, var(--accent, #f51b19), black 12%)"/>
    </linearGradient>
    <linearGradient id="fs-helmet" x1="827" y1="85" x2="982" y2="279" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff342b"/><stop offset="1" stop-color="#e71018"/>
    </linearGradient>
    <linearGradient id="fs-cream" x1="808" y1="300" x2="918" y2="550" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf7"/><stop offset=".65" stop-color="#fffaf2"/><stop offset="1" stop-color="#e6dbce"/>
    </linearGradient>
    <linearGradient id="fs-foot-fill" x1="642" y1="553" x2="660" y2="637" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf7"/><stop offset="1" stop-color="#e5d8c9"/>
    </linearGradient>
    <linearGradient id="fs-black" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#424343"/><stop offset=".5" stop-color="#222323"/><stop offset="1" stop-color="#111212"/>
    </linearGradient>
    <linearGradient id="fs-metal" x1="916" y1="518" x2="950" y2="579" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/><stop offset=".3" stop-color="#e9e9e6"/><stop offset=".5" stop-color="#999b9b"/><stop offset=".8" stop-color="#f4f5f2"/><stop offset="1" stop-color="#828484"/>
    </linearGradient>
    <linearGradient id="fs-yellow" x1="905" y1="76" x2="962" y2="177" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe76c"/><stop offset="1" stop-color="#ffc915"/>
    </linearGradient>
  </defs>
