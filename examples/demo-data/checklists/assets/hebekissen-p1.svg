<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="380" fill="#f4f5f7"/>
  <text x="24" y="38" font-size="20" font-weight="700" fill="#1d232b">Hebekissen unter der Last (Demo-Skizze)</text>
  <!-- ground -->
  <rect x="24" y="300" width="592" height="14" fill="#9aa3ad"/>
  <!-- load -->
  <rect x="120" y="150" width="400" height="70" rx="10" fill="#5b6570"/>
  <text x="320" y="192" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">Last</text>
  <!-- centre of gravity -->
  <line x1="300" y1="130" x2="300" y2="300" stroke="#c62828" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="306" y="126" font-size="14" font-weight="700" fill="#c62828">Schwerpunkt</text>
  <!-- cushion -->
  <rect x="220" y="236" width="160" height="64" rx="18" fill="#f9a825" stroke="#1d232b" stroke-width="3"/>
  <text x="300" y="274" font-size="16" font-weight="700" text-anchor="middle" fill="#1d232b">Hebekissen</text>
  <!-- crib -->
  <g fill="#a1887f" stroke="#4e342e" stroke-width="2">
    <rect x="410" y="284" width="90" height="16"/><rect x="420" y="268" width="16" height="16"/><rect x="474" y="268" width="16" height="16"/>
    <rect x="410" y="252" width="90" height="16"/><rect x="420" y="236" width="16" height="16"/><rect x="474" y="236" width="16" height="16"/>
  </g>
  <text x="455" y="345" font-size="15" font-weight="700" text-anchor="middle" fill="#1d232b">Krippe (Unterbau)</text>
  <text x="300" y="345" font-size="15" font-weight="700" text-anchor="middle" fill="#1d232b">Mitte unter Schwerpunkt</text>
  <text x="320" y="370" font-size="13" text-anchor="middle" fill="#5b6570">Synthetische Skizze für die KP-Front-Demo – keine Herstellerangabe.</text>
</svg>
