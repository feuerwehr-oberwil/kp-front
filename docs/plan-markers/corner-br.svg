<svg xmlns="http://www.w3.org/2000/svg" width="8mm" height="8mm" viewBox="0 0 8 8">
  <title>Bereichsecke unten rechts §EG]</title>
  <!-- Gegenstück zu corner-tl.svg: die Textmitte ist die untere rechte Ecke des
       Bereichs, die Schenkel zeigen in den Bereich zurück. Text bleibt Text. -->
  <g stroke="#1f6feb" stroke-width="0.2" stroke-linecap="round">
    <line x1="0.3" y1="4" x2="2.1" y2="4"/>
    <line x1="4" y1="0.3" x2="4" y2="3.1"/>
  </g>
  <text x="4" y="4.44" font-family="Helvetica, Arial, sans-serif" font-size="1.234"
        text-anchor="middle" fill="#1f6feb">§EG]</text>
</svg>
