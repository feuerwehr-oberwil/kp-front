<svg xmlns="http://www.w3.org/2000/svg" width="8mm" height="8mm" viewBox="0 0 8 8">
  <title>Geschoss-Marke §EG</title>
  <!-- Geschoss + Verbindungspunkt. Auf das Treppenhaus setzen: die MITTE des Textes
       ist der Verbindungspunkt, der Ring ist nur Zierde. Der Text ist ein echtes
       <text>-Element und MUSS Text bleiben – nie in Kurven wandeln. -->
  <g fill="none" stroke="#1f6feb" stroke-width="0.2" stroke-linecap="round">
    <circle cx="4" cy="4" r="2.6"/>
    <line x1="4" y1="0.5" x2="4" y2="1.4"/>
    <line x1="4" y1="6.6" x2="4" y2="7.5"/>
    <line x1="0.5" y1="4" x2="1.4" y2="4"/>
    <line x1="6.6" y1="4" x2="7.5" y2="4"/>
  </g>
  <text x="4" y="4.44" font-family="Helvetica, Arial, sans-serif" font-size="1.234"
        text-anchor="middle" fill="#1f6feb">§EG</text>
</svg>
