# Self-hosting KP Front on a VPS: the app (SPA + API in one image) + its Postgres.
# Railway users don't need this file — that path is driven by railway.json.
#
#   ./scripts/setup.sh      # the install: domain, port and nightly backup, then .env, the
#                           # stack, and the integration secrets into the credential store
#   ./scripts/init-env.sh   # or just the .env, with all four required values generated
#   docker compose up -d    # pulls the published image, runs migrations on boot
#
# Filling .env in by hand instead: all four under `--- Required ---` must be set –
# POSTGRES_PASSWORD, SECRET_KEY, ADMIN_SECRET and SEED_PIN. An empty SEED_PIN never gives you
# a usable deployment; what it looks like depends on the image (docs/SETUP.md §1).
#
# Updating:  docker compose pull && docker compose up -d
# Pinning:   set KP_FRONT_TAG=0.3.0 in .env (default: latest). Rollback = pin the older tag.
#
# Serves plain HTTP on ${APP_BIND:-0.0.0.0}:${APP_PORT:-8000} – pick a free port if something
# else on the host already owns 8000. For automatic HTTPS on a domain, add Caddy:
#   docker compose --profile tls up -d              # set DOMAIN in .env, see deploy/Caddyfile
#   …and set APP_BIND=127.0.0.1, or the app stays reachable in plaintext past Caddy.
#
# To build from source instead (contributors, or a patched fork), copy
# docker-compose.override.yml.example – never edit this file for it. See the `app` service below.

name: kp-front

# Cap container logs so a long-lived station VPS can't slowly fill its disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kpfront}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kpfront}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kpfront} -d ${POSTGRES_DB:-kpfront}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published ports: reachable only by `app` over the internal compose network.

  app:
    # Published on every git tag by .github/workflows/release.yml (linux/amd64 + linux/arm64).
    # KP_FRONT_TAG pins a version: 0.3.0 | 0.3 | latest.
    image: ghcr.io/feuerwehr-oberwil/kp-front:${KP_FRONT_TAG:-latest}
    # Build from source instead – do NOT edit this file for it:
    #   cp docker-compose.override.yml.example docker-compose.override.yml
    #   docker compose up -d --build            # or: ./scripts/setup.sh --build
    # The override renames the image and adds the `build:` block, so no tracked file changes
    # and `git pull` never conflicts on it.
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kpfront}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-kpfront}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (openssl rand -hex 32)}
      # Unlocks the /admin UI + admin-write API/CLI (separate from the editor PIN). Empty =
      # admin surface disabled (fail-closed). Generate: openssl rand -hex 24.
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      # Optional: expose the OpenAPI docs (/docs, /openapi.json) in production for integrators.
      EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-}
      # Leave blank when serving over HTTPS (Secure cookies follow ENVIRONMENT=production).
      # Set to false only for plain-HTTP access on a trusted LAN, so login cookies still stick.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      MEDIA_STORAGE_DIR: /data/storage
      SEED_DATABASE: ${SEED_DATABASE:-true}
      # Required whenever SEED_DATABASE is on in production — the seed file's PIN is public.
      # Six digits, not a well-known one. Missing, you get no login: this build refuses to
      # boot; the old v0.6.0 image came up green with an empty roster instead
      # (docs/SETUP.md §1 has both shapes).
      SEED_PIN: ${SEED_PIN:-}
      # The deployer's telemetry veto (PRIVACY.md). It has to be named here to work at all:
      # compose's .env is interpolation-only, so a KP_TELEMETRY_ENABLED=0 sitting in .env
      # never reaches the process unless it is passed through like this.
      #
      # The fallbacks deliberately repeat the application defaults rather than being blank.
      # Blank is not "unset" to this app — a blank flag AND a blank DSN each mean "off", so
      # `${KP_TELEMETRY_ENABLED:-}` would quietly disable telemetry for every compose
      # deployment instead of merely forwarding the operator's choice.
      KP_TELEMETRY_ENABLED: ${KP_TELEMETRY_ENABLED:-1}
      # Aim the same machinery at your own GlitchTip instead of ours; set it blank to switch
      # the forwarder off entirely. Default MUST match UPSTREAM_DSN in app/telemetry/dsn.py.
      KP_TELEMETRY_DSN: ${KP_TELEMETRY_DSN-https://f8ac2e518d46448d80037de2b4499141@ingest.kp-front.ch/1}
      # Aggregate, cookie-free visit counters are for the public demo only. Keep the
      # self-host default off, but pass an explicit opt-in through: compose's .env is
      # interpolation-only, so a documented VISIT_STATS=true otherwise does nothing.
      VISIT_STATS: ${VISIT_STATS:-false}
      # Overpass mirrors for the building-outline surface (PRIVACY.md). Same blank-is-not-unset
      # trap as the telemetry pair above: an empty value switches the surface off, so the
      # fallback repeats the application default from app/config.py.
      OVERPASS_MIRRORS: ${OVERPASS_MIRRORS-https://overpass.kumi.systems/api/interpreter,https://overpass-api.de/api/interpreter,https://maps.mail.ru/osm/tools/overpass/api/interpreter}
      # Weather normally downloads national MeteoSwiss observations, then asks Open-Meteo
      # for the point-based weather code (or uses it as fallback). An explicitly empty URL
      # disables the whole weather client; absent keeps the application default.
      OPEN_METEO_URL: ${OPEN_METEO_URL-https://api.open-meteo.com/v1/forecast}
      # ⚠️ The dead-man's switch, and it has to be listed here like everything else: an
      # operator who sets HEALTHCHECK_PING_URL in .env and never sees a ping would have no way
      # to tell "the monitor is misconfigured" from "compose never passed it in". Blank = off,
      # which is also the default in app/config.py, so no fallback value is needed.
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}
      # Optional integrations — leave blank to disable. See .env.example.
      DIVERA_ACCESS_KEY: ${DIVERA_ACCESS_KEY:-}
      DIVERA_WEBHOOK_SECRET: ${DIVERA_WEBHOOK_SECRET:-}
      DIVERA_PERSONNEL_ACCESS_KEY: ${DIVERA_PERSONNEL_ACCESS_KEY:-}
      TRACCAR_URL: ${TRACCAR_URL:-}
      TRACCAR_EMAIL: ${TRACCAR_EMAIL:-}
      TRACCAR_PASSWORD: ${TRACCAR_PASSWORD:-}
      # Generic alarm intake (POST /api/alarms) for non-Divera alerting systems.
      # Empty = endpoint disabled (fail-closed).
      ALARM_WEBHOOK_SECRET: ${ALARM_WEBHOOK_SECRET:-}
      # Public origin (https://front.example.org) for absolute links in outbound webhooks
      # and capture posters. Empty = links omitted.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Station print relay («An Stationsdrucker» queue + on-site polling agent).
      # Empty = agent endpoints 403 and the button never renders (fail-closed).
      PRINT_AGENT_SECRET: ${PRINT_AGENT_SECRET:-}
      # Web Push (killed-app alarms). ./scripts/setup.sh mints the pair into the encrypted
      # credential store, not into .env — a value here WINS over the stored one and makes the
      # field read-only in /admin → Zugangsdaten. Leave all three blank unless you deliberately
      # want the environment to own them.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # ⚠️ Blank, NOT the app's contact default. A fallback that differs from the declared
      # default is indistinguishable from a deployer's choice (app/credentials.py ·
      # `_env_value` compares against `Settings.model_fields[...].default`), so the old
      # `mailto:admin@example.org` here locked VAPID-Kontakt out of the browser on every
      # single compose install. Blank means «unset», and unset resolves to the app's own
      # default — mailto:kp-front@localhost.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Speech-to-text for the audio player (OpenAI-compatible server; see .env.example for
      # Groq/OpenAI/self-hosted examples). Blank = feature off (fail-closed); the app —
      # upload, player, waveform — works fully without it, only Transkribieren is absent.
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      # CARTO raster basemap browser key. Public in tile requests, but never commit it.
      CARTO_API_KEY: ${CARTO_API_KEY:-}
      # ⚠️ These two fallbacks must stay LITERALLY the app defaults (app/config.py) — see the
      # VAPID_SUBJECT note below. Change one to a value you prefer and you do not change a
      # default, you take the field away from every station's browser.
      STT_MODEL: ${STT_MODEL:-whisper-large-v3-turbo}
      STT_LANGUAGE: ${STT_LANGUAGE:-de}
      # Objektplan-Pull: fetch Modul-PDFs from an S3-compatible snapshot store instead of
      # having them pushed in. Any provider (MinIO, B2, a hosted bucket, AWS); a read-only
      # key is enough. Blank endpoint = no pull job is scheduled (fail-closed).
      PLANS_S3_ENDPOINT: ${PLANS_S3_ENDPOINT:-}
      PLANS_S3_BUCKET: ${PLANS_S3_BUCKET:-}
      PLANS_S3_PREFIX: ${PLANS_S3_PREFIX:-}
      PLANS_S3_REGION: ${PLANS_S3_REGION:-us-east-1}
      PLANS_S3_ACCESS_KEY_ID: ${PLANS_S3_ACCESS_KEY_ID:-}
      PLANS_S3_SECRET_ACCESS_KEY: ${PLANS_S3_SECRET_ACCESS_KEY:-}
      # (Numeric default here on purpose: an empty value would break int parsing.)
      PLANS_PULL_INTERVAL_MINUTES: ${PLANS_PULL_INTERVAL_MINUTES:-60}
      # Multipart upload cap in MB — keep above the media endpoint's 100 MB per-file cap.
      # (Numeric default here on purpose: an empty value would break int parsing.)
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-110}
      # swisstopo SearchServer for address autocomplete; override only with a compatible endpoint.
      GEOCODER_URL: ${GEOCODER_URL:-https://api3.geo.admin.ch/rest/services/api/SearchServer}
    volumes:
      - storage:/data/storage
    ports:
      # APP_BIND decides WHERE this port is published: 0.0.0.0 (default) on the LAN,
      # 127.0.0.1 as soon as anything terminates TLS in front (the `tls` profile below reaches
      # the app over the compose network, so Caddy keeps working while the plaintext door
      # closes). A published port is open whatever ufw says – DEPLOYMENT.md §3 has the shapes.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    healthcheck:
      # /ready probes DB + storage volume (not the static /health), so a data-layer outage
      # shows up as an unhealthy container instead of a green one serving errors.
      # ⚠️ That is ALL it does. Compose does not restart an unhealthy container (only an
      # EXITED one – that is `restart: unless-stopped`) and nothing here alerts anybody:
      # `docker compose ps` has to be read by a human. The thing that actually tells you is
      # HEALTHCHECK_PING_URL above – see DEPLOYMENT.md §5.5.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Optional automatic HTTPS. Enabled only with `--profile tls`; set DOMAIN (A record → this host).
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    logging: *default-logging
    profiles: ["tls"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Required for the tls profile; Caddy fails to start if empty (base profile ignores caddy).
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
