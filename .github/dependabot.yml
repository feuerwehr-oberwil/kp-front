version: 2
updates:
  # Frontend (pnpm)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # jsdom 30.1 breaks maplibre-gl 4.7 at import in vitest («reading '_buffer'» on the worker
    # Blob): MapView, mapTwist and the IncidentWorkspace harness fail to load (05.10.2026). Held
    # on 30.0.x until a jsdom past 30.1 or MapLibre 6 (#193) proves it fixed.
    ignore:
      - dependency-name: jsdom
        versions: [">= 30.1.0, < 30.2.0"]
    groups:
      # Keep noise down: batch non-major bumps into one PR.
      minor-and-patch:
        update-types: [minor, patch]

  # Backend (uv / pip-compatible)
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # codeql-action/init and /analyze must be the SAME version: proposed as two PRs (13.09.2026),
    # each failed CodeQL against the other's old half and neither could ever go green.
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  # Base images. Added after Node 20 sat three months past its 2026-04-30 end-of-life in the
  # Dockerfile's build stage without anything proposing the bump: npm, pip and actions were
  # all watched, and the one dependency a station actually RUNS was not.
  - package-ecosystem: docker
    directory: "/"
    # Node 25 is end-of-life; keep updates on the supported Node 24 LTS line.
    # ⚠️ The docker ecosystem takes no range here: «>=25.0.0 <26.0.0» made the WHOLE file
    # invalid, so Dependabot read none of it (found 20.09.2026). `25.x` is the form it accepts.
    # The Dockerfile pulls node from ECR Public (public.ecr.aws/docker/library/node, 09.10.2026),
    # which Dependabot names `docker/library/node`, not `node` — both are listed so the hold stays.
    ignore:
      - dependency-name: node
        versions: ["25.x"]
      - dependency-name: docker/library/node
        versions: ["25.x"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
