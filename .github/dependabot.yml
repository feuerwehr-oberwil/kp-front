version: 2
updates:
  # Frontend (pnpm)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Keep noise down: batch non-major bumps into one PR.
      minor-and-patch:
        update-types: [minor, patch]

  # Backend (uv / pip-compatible)
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Base images. Added after Node 20 sat three months past its 2026-04-30 end-of-life in the
  # Dockerfile's build stage without anything proposing the bump: npm, pip and actions were
  # all watched, and the one dependency a station actually RUNS was not.
  - package-ecosystem: docker
    directory: "/"
    # Node 25 is end-of-life; keep updates on the supported Node 24 LTS line.
    ignore:
      - dependency-name: node
        versions: [">=25.0.0 <26.0.0"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
