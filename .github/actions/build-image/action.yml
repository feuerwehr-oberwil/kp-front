name: Build the production image
description: >-
  Build this revision once. Export a Docker archive for CI consumers, or load it locally for
  standalone workflows. Only the producer exports the shared layer cache; no registry writes.
inputs:
  export-path:
    description: Docker archive path (empty loads the image into the local daemon)
    default: ''
runs:
  using: composite
  steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      with:
        # Avoid Docker Hub's shared anonymous pull allowance on hosted runners.
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

    - name: Build image (gha-cached)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: Dockerfile
        load: ${{ inputs.export-path == '' }}
        outputs: ${{ inputs.export-path != '' && format('type=docker,dest={0}', inputs.export-path) || '' }}
        tags: ghcr.io/feuerwehr-oberwil/kp-front:ci
        # CI's full revision belongs to the runtime/label. Its frontend keeps the existing
        # test-build stamp so a backend-only revision can reuse the unchanged SPA layer.
        build-args: RUNTIME_GIT_SHA=${{ github.sha }}
        labels: org.opencontainers.image.revision=${{ github.sha }}
        # Read the old scope during the transition; independent consumers never export it.
        cache-from: |
          type=gha,scope=ci-amd64
          type=gha
        cache-to: type=gha,scope=ci-amd64,mode=max
