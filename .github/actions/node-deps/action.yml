name: Set up Node and the frontend dependencies
description: >-
  pnpm (the version in package.json · packageManager), Node 24 with the pnpm store cached, then
  `pnpm install --frozen-lockfile`. Every job that runs Node takes this one step, so the Node
  version and the install cannot drift apart between jobs. Needs the checkout first.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6; pnpm from packageManager
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24  # matches Dockerfile (node:24-slim); 20 went EOL 2026-04-30
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
