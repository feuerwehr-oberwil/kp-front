name: Install Playwright browsers (cached)
description: >-
  Install the named Playwright browsers with ~/.cache/ms-playwright restored from the Actions
  cache, keyed on the lockfile's Playwright version. The CDN download is what stalled browser
  jobs into their timeout (sweep D.1, 23.10.2026: 647 s instead of 49 s); on a hit only the apt
  dependencies are installed. Needs `pnpm install` first.
inputs:
  browsers:
    description: Space-separated Playwright browser names, e.g. "chromium webkit"
    default: chromium
runs:
  using: composite
  steps:
    # Regional mirrors can trickle packages without triggering apt's stall timeout.
    # The EC2 mirror took 474 s for 32 MB on 2026-11-17, before any workspace test ran.
    - name: Prefer Ubuntu archive mirrors
      shell: bash
      run: |
        if [ -f /etc/apt/apt-mirrors.txt ] && grep -Eq '^https?://archive\.ubuntu\.com/' /etc/apt/apt-mirrors.txt; then
          sudo sed -Ei '/(azure|ec2)\.archive\.ubuntu\.com\//d' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
        fi

    - name: Identify the Playwright version and Ubuntu release
      id: pw
      shell: bash
      run: |
        source /etc/os-release
        echo "image=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
        echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Restore the browser cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        # A WebKit built for one Ubuntu release
        # does not start on the next (12.11.2026: libicudata.so.74 missing on 26.04)
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-${{ inputs.browsers }}

    # Both steps run apt. Three tries, 30 s apart: security.ubuntu.com was unreachable from the
    # runners for ~30 min on 19.11.2026 and failed every browser job of #704 three times (exit 100).
    - name: Download the browsers (cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        for try in 1 2 3; do
          pnpm exec playwright install --with-deps ${{ inputs.browsers }} && exit 0
          echo "::warning::playwright install failed (try $try of 3)"; sleep 30
        done
        exit 1

    - name: System dependencies only (cache hit)
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        for try in 1 2 3; do
          pnpm exec playwright install-deps ${{ inputs.browsers }} && exit 0
          echo "::warning::playwright install-deps failed (try $try of 3)"; sleep 30
        done
        exit 1
