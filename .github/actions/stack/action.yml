name: Boot the production stack
description: >-
  Load this run's image artifact (or build it for a standalone workflow), then boot an isolated
  docker-compose stack on :8000, migrated and seeded. Reads SEED_PIN, ADMIN_SECRET,
  ALARM_WEBHOOK_SECRET and COMPOSE_FILE from the job's env.
inputs:
  image-artifact:
    description: Image artifact from this workflow run (empty builds locally)
    default: ''
runs:
  using: composite
  steps:
    - name: Write .env (required vars must exist before compose reads the file)
      shell: bash
      run: |
        {
          echo "POSTGRES_PASSWORD=ci_test_password"
          echo "SECRET_KEY=$(openssl rand -hex 32)"
          echo "APP_PORT=8000"
          echo "COOKIE_SECURE=false"
          echo "SEED_PIN=$SEED_PIN"
          echo "ADMIN_SECRET=$ADMIN_SECRET"
          echo "ALARM_WEBHOOK_SECRET=$ALARM_WEBHOOK_SECRET"
          # compose pulls ghcr.io/…:${KP_FRONT_TAG:-latest}; point it at the image built
          # below so the stack boots THIS commit instead of the last published release.
          echo "KP_FRONT_TAG=ci"
          # The Karte's weather layer fetches MeteoSwiss radar from the backend; in CI
          # that is outbound traffic, CPU (a radar frame takes ~1 s to render) and a picture that
          # changes with the sky. Off here: the e2e sees «not served», and the perf + visual
          # harnesses answer /api/weather/layer themselves with a canned layer (e2e/*/harness.ts).
          echo "WEATHER_LAYER_ENABLED=false"
        } > .env

    - name: Download this run's production image
      if: inputs.image-artifact != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ${{ inputs.image-artifact }}
        path: ${{ runner.temp }}/kp-front-image

    - name: Load this run's production image
      if: inputs.image-artifact != ''
      shell: bash
      run: zstd --decompress --stdout "$RUNNER_TEMP/kp-front-image/kp-front-image.tar.zst" | docker load

    - name: Build the production image (standalone workflow)
      if: inputs.image-artifact == ''
      uses: ./.github/actions/build-image

    - name: Verify the loaded image belongs to this revision
      shell: bash
      run: |
        revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' ghcr.io/feuerwehr-oberwil/kp-front:ci)
        test "$revision" = "$GITHUB_SHA"

    # docker-compose.yml names its Docker Official Images on ECR Public, for the stations that run
    # it. CI does not pull them there: ECR Public meters anonymous clients by source IP, GitHub's
    # runners share theirs, and once the shared allowance is gone every pull is «toomanyrequests:
    # Data limit exceeded» (13.10.2026; «Rate exceeded» past ~1 pull/s before that). An overlay
    # swaps each one for the same image (same tag, same digest) on mirror.gcr.io, Google's cache
    # of Docker Hub; COMPOSE_FILE carries it into every later compose call of the job.
    - name: Pull the stack's registry images from mirror.gcr.io (one at a time, retried)
      shell: bash
      run: |
        overlay="$RUNNER_TEMP/compose.mirror.json"
        docker compose config --format json | jq '{services: (.services
          | with_entries(select(.value.image // "" | startswith("public.ecr.aws/docker/library/"))
            | .value = {image: (.value.image | sub("^public\\.ecr\\.aws/docker/library/"; "mirror.gcr.io/library/"))}))}' > "$overlay"
        export COMPOSE_FILE="$COMPOSE_FILE:$overlay"
        echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
        for img in $(docker compose config --images | grep -v '^ghcr.io/feuerwehr-oberwil/'); do
          echo "pulling $img"
          for i in 1 2 3 4 5; do
            docker pull -q "$img" && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 5))
          done
        done

    - name: Boot the stack
      shell: bash
      run: docker compose up -d --wait --wait-timeout 180   # migrations + seed + readiness
