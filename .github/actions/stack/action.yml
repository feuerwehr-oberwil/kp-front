name: Boot the production stack
description: >-
  Build THIS commit's production image and boot docker-compose with it on :8000 (db + app,
  migrated and seeded), the stack Railway and self-hosters run. Shared by ci.yml's «Image» and
  «Performance» jobs. Reads SEED_PIN, ADMIN_SECRET, ALARM_WEBHOOK_SECRET and COMPOSE_FILE from the
  job's env.
runs:
  using: composite
  steps:
    - name: Write .env (required vars must exist before compose reads the file)
      shell: bash
      run: |
        {
          echo "POSTGRES_PASSWORD=ci_test_password"
          echo "SECRET_KEY=$(openssl rand -hex 32)"
          echo "APP_PORT=8000"
          echo "COOKIE_SECURE=false"
          echo "SEED_PIN=$SEED_PIN"
          echo "ADMIN_SECRET=$ADMIN_SECRET"
          echo "ALARM_WEBHOOK_SECRET=$ALARM_WEBHOOK_SECRET"
          # compose pulls ghcr.io/…:${KP_FRONT_TAG:-latest}; point it at the image built
          # below so the stack boots THIS commit instead of the last published release.
          echo "KP_FRONT_TAG=ci"
          # The Karte's weather layer fetches MeteoSwiss radar + warnings from the backend; in CI
          # that is outbound traffic, CPU (a radar frame takes ~1 s to render) and a picture that
          # changes with the sky. Off here: the e2e sees «not served», and the perf + visual
          # harnesses answer /api/weather/layer themselves with a canned layer (e2e/*/harness.ts).
          echo "WEATHER_LAYER_ENABLED=false"
        } > .env

    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Build image (gha-cached)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: Dockerfile
        load: true            # load into the local daemon; do not push
        tags: ghcr.io/feuerwehr-oberwil/kp-front:ci   # matches KP_FRONT_TAG=ci above
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Boot the stack
      shell: bash
      run: docker compose up -d --wait   # waits for db + app healthchecks (migrations + seed)
