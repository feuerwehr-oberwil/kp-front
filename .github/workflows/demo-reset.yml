name: Demo reset

# Keeps the public demo (kp-front-demo on Railway) clean: wipes incident data + roster,
# re-ensures the two demo accounts, and reloads the synthetic Musterdorf dataset.
# The demo now PERSISTS edits during the day and hard-resets NIGHTLY — the reliable reset is the
# in-process cron (DEMO_RESET_CRON, Europe/Zurich midnight). This workflow runs once daily as the
# belt-and-suspenders full reload (config/geodata/objects too, which the in-process job skips).
# On demand via the Actions tab. No-op if the demo secrets are unset.

on:
  schedule:
    - cron: "0 23 * * *"   # once daily ≈ midnight Europe/Zurich (23:00 UTC; ±1h across DST)
  workflow_dispatch: {}

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ Pin the ref explicitly. The default for a `schedule` event is the SHA the run was
      # queued from, which drifts behind main whenever the queue is slow — and this job publishes
      # the tree it checks out onto the live demo, so "whatever was current when the cron fired"
      # is not good enough. `ref: main` takes the tip at RUN time, which is also the only thing
      # that satisfies the preflight in scripts/demo-reset.sh (HEAD must equal origin/main).
      - uses: actions/checkout@v7
        with:
          ref: main

      # Gate on the demo secret via a step OUTPUT — the `secrets` context is not reliably
      # usable in `if:` expressions, so we surface presence as an output and branch on that.
      # This also skips the toolchain setup entirely on forks/deploys without demo secrets.
      - name: Check demo secrets
        id: gate
        env:
          DEMO_DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
        run: |
          if [ -n "$DEMO_DATABASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DEMO_* secrets not set — skipping (configure them in repo settings to enable)."
          fi

      - name: Install uv
        if: steps.gate.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        if: steps.gate.outputs.enabled == 'true'
        run: uv python install 3.12

      - name: Sync backend dependencies
        if: steps.gate.outputs.enabled == 'true'
        working-directory: backend
        run: uv sync

      - name: Reset demo
        if: steps.gate.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.DEMO_SECRET_KEY }}
          KP_BASE_URL: ${{ secrets.DEMO_BASE_URL }}
          KP_ADMIN_SECRET: ${{ secrets.DEMO_ADMIN_SECRET }}
        run: bash scripts/demo-reset.sh
