name: Demo reset

# Keeps the public demo (kp-front-demo on Railway) clean: wipes incident data + roster,
# re-ensures the two demo accounts, and reloads the synthetic Musterdorf dataset.
# The demo resets itself in-process: on every boot, i.e. on every wake from Railway «Serverless»
# sleep (backend app/demo_sleep · reset_on_boot), and on DEMO_RESET_CRON (`0 0,12 * * *`) while
# it is in use. This workflow is the FULL reload (config/geodata/objects/Checklisten too, which
# the in-process reset skips): run it by hand from the Actions tab after a demo-data change.
#
# ⚠️ No `schedule:` any more (27.11.2026). A daily run woke the sleeping demo every night for
# nothing – the demo sleeps when nobody uses it, and nothing may ping it on a timer.
# No-op if the demo secrets are unset.

on:
  workflow_dispatch: {}

# The job reads the repository and nothing else: it talks to the demo with its own secrets,
# never through the workflow token. Without this block the token gets the repository default,
# which is read AND write here.
permissions:
  contents: read

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ Pin the ref explicitly. The default for a `schedule` event is the SHA the run was
      # queued from, which drifts behind main whenever the queue is slow — and this job publishes
      # the tree it checks out onto the live demo, so "whatever was current when the cron fired"
      # is not good enough. `ref: main` takes the tip at RUN time, which is also the only thing
      # that satisfies the preflight in scripts/demo-reset.sh (HEAD must equal origin/main).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      # Gate on the demo secret via a step OUTPUT — the `secrets` context is not reliably
      # usable in `if:` expressions, so we surface presence as an output and branch on that.
      # This also skips the toolchain setup entirely on forks/deploys without demo secrets.
      - name: Check demo secrets
        id: gate
        env:
          DEMO_DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
        run: |
          if [ -n "$DEMO_DATABASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ -f .github/demo-enabled ]; then
            # ⚠️ See the watchdog: on a repo that HAS a demo, a missing secret is a failure and
            # not a skip. A green "reset" that reset nothing is how three nights in a row looked.
            echo "::error::DEMO_DATABASE_URL is empty but .github/demo-enabled exists — this repo"
            echo "::error::HAS a demo, so the secret has been rotated, renamed or removed. The"
            echo "::error::nightly reset has not been running."
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DEMO_* secrets not set and no .github/demo-enabled marker — this repo has no demo."
          fi

      - name: Install uv
        if: steps.gate.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        if: steps.gate.outputs.enabled == 'true'
        run: uv python install 3.12

      - name: Sync backend dependencies
        if: steps.gate.outputs.enabled == 'true'
        working-directory: backend
        run: uv sync

      - name: Reset demo
        if: steps.gate.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.DEMO_SECRET_KEY }}
          KP_BASE_URL: ${{ secrets.DEMO_BASE_URL }}
          KP_ADMIN_SECRET: ${{ secrets.DEMO_ADMIN_SECRET }}
        run: bash scripts/demo-reset.sh
