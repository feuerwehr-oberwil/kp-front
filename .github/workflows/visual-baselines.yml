name: Visual baselines

# Re-shoot EVERY screenshot baseline on a GitHub runner (docs/testing/visual-regression.md ·
# «Accepting a baseline»). Baselines come from here or from a red «Visual» run in ci.yml — never
# from a laptop: fonts and rasterisation differ, and the next CI run would fail on them.
#
# Two ways to start it:
#   · Actions → «Visual baselines» → Run workflow on your branch (`gh workflow run
#     visual-baselines.yml --ref <branch>`) — once this file is on main;
#   · the label `visual-update` on a pull request (runs on the PR's head; remove and re-add to run
#     it again).
# Either way it only UPLOADS the pictures (artifact `visual-results`, `actual/`). It never pushes:
# a commit pushed with the workflow's token would not run the PR's CI, and it would carry no
# human sign-off (DCO). Take them with `just visual-accept <run-id>` and commit them on their own,
# saying why the look changed.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoot:
    name: Shoot new baselines
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'visual-update'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEED_PIN: '194731'   # the same throwaway values as ci.yml · «Visual»
      ADMIN_SECRET: 'ci-only-admin-secret-not-a-credential'
      ALARM_WEBHOOK_SECRET: 'ci-only-fleet-secret-not-a-credential'
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and boot the production stack
        uses: ./.github/actions/stack

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6; pnpm from packageManager

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps (Playwright)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # --update-snapshots=all rewrites every baseline, changed or not; the artifact then holds the
      # complete set in the same layout a red «Visual» run uploads (visual-results/actual/).
      - name: Shoot every state
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_PIN: ${{ env.SEED_PIN }}
          VISUAL: '1'
        run: |
          pnpm exec playwright test --project visual --update-snapshots=all --reporter=list
          mkdir -p visual-results/actual
          cp e2e/visual/baseline/*.png visual-results/actual/
          {
            echo "### New screenshot baselines"
            echo
            echo "Take them: \`just visual-accept ${{ github.run_id }}\` — then look at every picture, and commit them on their own, saying why."
            echo
            git status --short e2e/visual/baseline | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-results
          path: visual-results/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v
