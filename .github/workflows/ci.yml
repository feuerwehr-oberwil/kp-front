name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this whole gate against the tag before publishing an image.
  workflow_call:

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Frontend: type-check + production build --------------------------------------
  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6; pnpm from packageManager

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24  # matches Dockerfile (node:24-slim); 20 went EOL 2026-04-30
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Type-check (tsc --noEmit)
        run: pnpm exec tsc --noEmit

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build SPA
        run: pnpm build

      # GitHub Pages serves site/ verbatim, so the generated pages are committed.
      # This fails if index.html / fr/index.html are behind the template or the
      # texts – otherwise the site in the repo stops being the site on the web.
      - name: Landing page is built from its sources
        run: node site/build.mjs --check

      # High/critical production advisories block the gate. Dependabot proposes routine
      # bumps; any temporary exception must name one advisory and its expiry in this file.
      - name: Dependency audit (pnpm audit)
        run: pnpm audit --prod --audit-level high

      # Blocking LICENSE audit (distinct from the vulnerability audit above): a new prod
      # dependency with an AGPL-incompatible license fails CI. Allowlist + per-package
      # overrides live in the script.
      - name: License audit (prod deps)
        run: python3 scripts/check_licenses.py frontend

  # --- Secrets: fail the build if a credential-looking string is committed -----------
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # CLI via container (not gitleaks-action, which needs a license key for org repos).
      # Scans exactly the TRACKED tree at HEAD (git archive), so local .env files and
      # node_modules never enter the picture; deliberate test values carry inline
      # `gitleaks:allow` comments. History cleanup is the OSS-squash's job (Phase B).
      - name: Scan tracked tree for secrets
        run: |
          mkdir -p /tmp/scan
          git archive HEAD | tar -x -C /tmp/scan
          docker run --rm -v /tmp/scan:/repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --no-git --redact --exit-code 1

  # --- Backend: ruff + migrations + pytest ------------------------------------------
  backend:
    name: Backend (ruff + alembic + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109
        env:
          POSTGRES_USER: kpfront
          POSTGRES_PASSWORD: kpfront
          POSTGRES_DB: kpfront
        ports:
          - 5432:5432
        # Wait until Postgres is ready before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U kpfront"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI secret: 64-hex (>= 32 chars) so config.py accepts it; non-production value.
      SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef # gitleaks:allow
      DATABASE_URL: postgresql+asyncpg://kpfront:kpfront@localhost:5432/kpfront

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (incl. dev)
        run: uv sync --extra dev

      # Formatting is a gate, not a suggestion — same as kp-rueck. Fix locally with
      # `uv run ruff format .` from backend/.
      - name: Ruff format check
        run: uv run ruff format --check .

      # `.` not `app`: alembic/ and tests/ are lint-clean too, and code that CI never looks
      # at is where the rot starts. Rule set + per-file ignores live in backend/pyproject.toml.
      - name: Ruff lint
        run: uv run ruff check .

      # Blocking over the whole app tree. It went in at zero errors and must stay there —
      # if this ever gets expensive to satisfy, fix the types, don't narrow the path.
      - name: Type check (mypy)
        run: uv run mypy app

      # High/critical dependency advisories block the gate. Keep any unavoidable exception
      # narrow (`--ignore-vuln ID`) and record its expiry/rationale next to the command.
      - name: pip-audit (dependency vulnerabilities)
        run: uv run --with pip-audit pip-audit

      # Blocking LICENSE audit — same rationale as the frontend job's. Runs from the repo
      # root (the script cd's into backend/ itself).
      - name: License audit (deps)
        working-directory: .
        run: python3 scripts/check_licenses.py backend

      - name: Alembic upgrade head
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -q

  # --- Image: lint + build + boot + smoke the actual production container ------------
  # CI builds the real Dockerfile/compose stack that Railway and self-hosters run, so a
  # Dockerfile or compose regression can't ship green. Nothing is pushed here — publishing
  # to GHCR happens in release.yml, which runs this same workflow first.
  image:
    name: Image (hadolint + build + smoke)
    runs-on: ubuntu-latest
    env:
      # compose hardcodes ENVIRONMENT=production, and since 23a4441 seeding refuses to run
      # there without an explicit PIN (the seed file's own is in the README). Without this the
      # stack still boots — seeding only logs — and the smoke then reads an EMPTY roster and
      # dies on an IndexError, which says nothing about the actual cause. Six digits, none of
      # the well-known ones (backend/app/seed.py rejects those); both smokes log in with it.
      SEED_PIN: '194731'
      # The admin surface is fail-closed: empty ADMIN_SECRET = /admin returns 403 and the admin
      # e2e can't run at all. A throwaway CI value (≥16 chars, see config.py) so the browser
      # smoke can reach «Mitglieder & Zugriff» — the surface where a stacking-order regression
      # made every row action unclickable and shipped unnoticed in v0.6.0.
      ADMIN_SECRET: 'ci-only-admin-secret-not-a-credential'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        continue-on-error: true  # advisory until the existing Dockerfile baseline is clean
        with:
          dockerfile: Dockerfile

      - name: Write .env (required vars must exist before compose reads the file)
        run: |
          {
            echo "POSTGRES_PASSWORD=ci_test_password"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "APP_PORT=8000"
            echo "COOKIE_SECURE=false"
            echo "SEED_PIN=$SEED_PIN"
            echo "ADMIN_SECRET=$ADMIN_SECRET"
            # compose pulls ghcr.io/…:${KP_FRONT_TAG:-latest}; point it at the image built
            # below so the stack boots THIS commit instead of the last published release.
            echo "KP_FRONT_TAG=ci"
          } > .env

      - name: Validate compose config (base + tls profile)
        run: |
          docker compose config -q
          DOMAIN=example.org docker compose --profile tls config -q

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image (gha-cached)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          load: true            # load into the local daemon; do not push
          tags: ghcr.io/feuerwehr-oberwil/kp-front:ci   # matches KP_FRONT_TAG=ci above
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the stack
        run: docker compose up -d --wait   # waits for db + app healthchecks (migrations + seed)

      - name: Smoke test (health + seed + kiosk login)
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ready   # DB + storage readiness in the real container
          # Roster proves seeding ran; login proves auth + DB write + cookie issuance. An empty
          # roster means seeding was skipped or raised — say so here instead of letting python
          # fail on [0] with an IndexError that names nothing.
          ROSTER=$(curl -fsS http://localhost:8000/api/auth/roster)
          test "$(printf '%s' "$ROSTER" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')" != "0" \
            || { echo "roster is empty — seeding did not run; see the container logs below"; exit 1; }
          USERID=$(printf '%s' "$ROSTER" | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["id"])')
          # In production the seeded PIN is SEED_PIN, never the seed file's own (see seed.py).
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' -d "{\"user_id\":\"$USERID\",\"pin\":\"$SEED_PIN\"}")
          test "$code" = "200" || { echo "login smoke failed: HTTP $code"; exit 1; }
          echo "image smoke OK"

      # Browser-driven white-screen smoke against the SAME running production container.
      # Catches the catastrophic class the curl check can't see: a surface that throws on
      # mount, a wedged session, a build that loads blank.
      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6; pnpm from packageManager

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps (Playwright)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke (browser → running container)
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_PIN: ${{ env.SEED_PIN }}  # the browser login needs the same PIN the seed used
          E2E_ADMIN_SECRET: ${{ env.ADMIN_SECRET }}  # unlocks /admin for the row-menu spec
        run: pnpm exec playwright test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
