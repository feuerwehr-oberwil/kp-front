name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this whole gate against the tag before publishing an image.
  workflow_call:

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Frontend: type-check + production build --------------------------------------
  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6; pnpm from packageManager

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24  # matches Dockerfile (node:24-slim); 20 went EOL 2026-04-30
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # eslint's own cache (content-hashed, node_modules/.cache/eslint): a run re-lints only the
      # files that changed since the cached one. Keyed on the lockfile + config, so a plugin or
      # rule change starts cold; every run saves its own entry under the sha.
      - name: Restore eslint cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js') }}-

      # Per-rule ratchet against scripts/eslint-baseline.json (scripts/lint-ratchet.mjs).
      - name: Lint (eslint, per-rule ratchet)
        run: pnpm lint

      - name: Type-check (tsc --noEmit)
        run: pnpm exec tsc --noEmit

      # The Playwright specs are Node code outside src/ — their own tsconfig (e2e/README.md).
      - name: Type-check e2e (tsc -p tsconfig.e2e.json)
        run: pnpm exec tsc -p tsconfig.e2e.json

      # ONE run, with coverage: the floor in scripts/coverage-floor.json fails it (vite.config.ts ·
      # test.coverage). The totals go to the job summary; `pnpm coverage:raise` lifts the floor.
      - name: Unit tests + coverage (vitest)
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total
            const f = require("./scripts/coverage-floor.json").floor
            const rows = ["statements", "branches", "functions", "lines"].map((m) => `| ${m} | ${t[m].pct.toFixed(2)} % | ${f[m]} % |`)
            console.log(["### Frontend coverage (vitest)", "", "| | measured | floor |", "|---|---|---|", ...rows].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Build SPA
        run: pnpm build

      # Hidden sourcemaps (vite.config.ts · build.sourcemap, docs/SOURCEMAPS.md): they exist,
      # no shipped file references them, and the service worker precaches none.
      - name: Sourcemaps are hidden and not precached
        run: node scripts/check-sourcemaps.mjs

      # Gzipped entry / App / maplibre / pdf worker / CSS against scripts/bundle-baseline.json,
      # +5 % budget. A growth the change buys on purpose: `--update`, own commit, with the reason.
      - name: Bundle budget
        run: node scripts/check-bundle-size.mjs

      # GitHub Pages serves site/ verbatim, so the generated pages are committed.
      # This fails if index.html / fr/index.html are behind the template or the
      # texts – otherwise the site in the repo stops being the site on the web.
      - name: Landing page is built from its sources
        run: node site/build.mjs --check

      # High/critical production advisories block the gate. Dependabot proposes routine
      # bumps; any temporary exception must name one advisory and its expiry in this file.
      #
      # Current exception (1), declared in pnpm-workspace.yaml · auditConfig.ignoreGhsas:
      #   GHSA-jrc7-96c5-q579 — maplibre-gl DOM.sanitize() bypass, patched >=6.4.1.
      #   We run 4.x: inside the version range, outside the defect (4.7.1 ships no DOM.sanitize),
      #   and no attacker-controlled string reaches a maplibre HTML sink. EXPIRES 2026-12-31;
      #   the fix is the 4→6 upgrade, not a renewal. Reasoning in full beside the entry there.
      - name: Dependency audit (pnpm audit)
        run: pnpm audit --prod --audit-level high

      # Full-tree audit (SEC-11): the --prod gate above never sees dev-only tooling (Vite,
      # Vitest, esbuild, …), so a class of advisories was invisible to CI. The full tree is
      # currently clean (0), so gate at MODERATE — a stricter bar than --prod's high, so a future
      # Moderate advisory in the toolchain fails CI too. Keep it clean rather than growing an
      # ignore list — a toolchain bump is the fix, not a suppressed line here.
      - name: Dependency audit, full tree (pnpm audit)
        run: pnpm audit --audit-level moderate

      # Blocking LICENSE audit (distinct from the vulnerability audit above): a new prod
      # dependency with an AGPL-incompatible license fails CI. Allowlist + per-package
      # overrides live in the script.
      - name: License audit (prod deps)
        run: python3 scripts/check_licenses.py frontend

  # --- Secrets: fail the build if a credential-looking string is committed -----------
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # CLI via container (not gitleaks-action, which needs a license key for org repos).
      # Scans exactly the TRACKED tree at HEAD (git archive), so local .env files and
      # node_modules never enter the picture; deliberate test values carry inline
      # `gitleaks:allow` comments. History cleanup is the OSS-squash's job (Phase B).
      - name: Scan tracked tree for secrets
        run: |
          mkdir -p /tmp/scan
          git archive HEAD | tar -x -C /tmp/scan
          docker run --rm -v /tmp/scan:/repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --no-git --redact --exit-code 1

  # --- Backend: ruff + migrations + pytest ------------------------------------------
  backend:
    name: Backend (ruff + alembic + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109
        env:
          POSTGRES_USER: kpfront
          POSTGRES_PASSWORD: kpfront
          POSTGRES_DB: kpfront
        ports:
          - 5432:5432
        # Wait until Postgres is ready before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U kpfront"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI secret: 64-hex (>= 32 chars) so config.py accepts it; non-production value.
      SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef # gitleaks:allow
      DATABASE_URL: postgresql+asyncpg://kpfront:kpfront@localhost:5432/kpfront

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (incl. dev)
        # `georef` too: without it the auto-alignment tests importorskip themselves away and
        # the feature's load-bearing honesty rules go ungated. The PRODUCTION image still
        # excludes the extra on purpose (the endpoint 503s and the app degrades to the
        # manual point flow) — this is test tooling, not a deployment decision.
        run: uv sync --extra dev --extra georef

      # Formatting is a gate, not a suggestion — same as kp-rueck. Fix locally with
      # `uv run ruff format .` from backend/.
      - name: Ruff format check
        run: uv run ruff format --check .

      # `.` not `app`: alembic/ and tests/ are lint-clean too, and code that CI never looks
      # at is where the rot starts. Rule set + per-file ignores live in backend/pyproject.toml.
      - name: Ruff lint
        run: uv run ruff check .

      # Blocking over the whole app tree. It went in at zero errors and must stay there —
      # if this ever gets expensive to satisfy, fix the types, don't narrow the path.
      - name: Type check (mypy)
        run: uv run mypy app

      # High/critical dependency advisories block the gate. Keep any unavoidable exception
      # narrow (`--ignore-vuln ID`) and record its expiry/rationale next to the command.
      - name: pip-audit (dependency vulnerabilities)
        run: uv run --with pip-audit pip-audit

      # Blocking LICENSE audit — same rationale as the frontend job's. Runs from the repo
      # root (the script cd's into backend/ itself).
      - name: License audit (deps)
        working-directory: .
        run: python3 scripts/check_licenses.py backend

      - name: Alembic upgrade head
        run: uv run alembic upgrade head

      # A throwaway database for a test run: nothing in it has to survive a crash, so it need not
      # wait for the disk. All three settings take effect on a reload (no restart; a service
      # container cannot be given server flags). Building the schema went from ~1.7 s to ~0.25 s
      # per round on a local Postgres 16 — the suite does that once per worker now, but every
      # test still commits, and every commit waited for an fsync.
      - name: Postgres without fsync (test database only)
        env:
          PGPASSWORD: kpfront
        run: |
          psql -h localhost -U kpfront -d kpfront -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      # `-n 4` (pytest-xdist): this step was 14.6 of the job's 15.6 minutes, serially, on a
      # 4-vCPU runner. Each worker gets its own database (kpfront_gw0 …, tests/conftest.py) and
      # builds the schema once instead of per test. `-n` is not in addopts on purpose: a plain
      # `uv run pytest` stays serial. `--durations` keeps the slowest tests in sight — one slow
      # test now holds up a whole worker.
      - name: Pytest
        run: uv run pytest -q -n 4 --durations=15

  # --- Image: lint + build + boot + smoke the actual production container ------------
  # CI builds the real Dockerfile/compose stack that Railway and self-hosters run, so a
  # Dockerfile or compose regression can't ship green. Nothing is pushed here — publishing
  # to GHCR happens in release.yml, which runs this same workflow first.
  image:
    name: Image (hadolint + build + smoke)
    runs-on: ubuntu-latest
    env:
      # compose hardcodes ENVIRONMENT=production, and since 23a4441 seeding refuses to run
      # there without an explicit PIN (the seed file's own is in the README). Without this the
      # stack still boots — seeding only logs — and the smoke then reads an EMPTY roster and
      # dies on an IndexError, which says nothing about the actual cause. Six digits, none of
      # the well-known ones (backend/app/seed.py rejects those); both smokes log in with it.
      SEED_PIN: '194731'
      # The admin surface is fail-closed: empty ADMIN_SECRET = /admin returns 403 and the admin
      # e2e can't run at all. A throwaway CI value (≥16 chars, see config.py) so the browser
      # smoke can reach «Mitglieder & Zugriff» — the surface where a stacking-order regression
      # made every row action unclickable and shipped unnoticed in v0.6.0.
      ADMIN_SECRET: 'ci-only-admin-secret-not-a-credential'
      # The field scenario (e2e/field-scenario.spec.ts) parks a fake TLF next to its Einsatz:
      # the overlay switches the fake fleet on (TRACCAR_FAKE, never in the production file), and
      # injecting needs the intake secret — a throwaway CI value, same as the two above.
      COMPOSE_FILE: docker-compose.yml:e2e/compose.e2e.yml
      ALARM_WEBHOOK_SECRET: 'ci-only-fleet-secret-not-a-credential'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        continue-on-error: true  # advisory until the existing Dockerfile baseline is clean
        with:
          dockerfile: Dockerfile

      # .env, the image of THIS commit, and the stack booted from it — shared with «Performance»
      - name: Build and boot the production stack
        uses: ./.github/actions/stack

      - name: Validate compose config (base + tls profile)
        env:
          COMPOSE_FILE: docker-compose.yml  # the file stations run, without the e2e overlay
        run: |
          docker compose config -q
          DOMAIN=example.org docker compose --profile tls config -q

      - name: Smoke test (health + seed + kiosk login)
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ready   # DB + storage readiness in the real container
          # Roster proves seeding ran; login proves auth + DB write + cookie issuance. An empty
          # roster means seeding was skipped or raised — say so here instead of letting python
          # fail on [0] with an IndexError that names nothing.
          ROSTER=$(curl -fsS http://localhost:8000/api/auth/roster)
          test "$(printf '%s' "$ROSTER" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')" != "0" \
            || { echo "roster is empty — seeding did not run; see the container logs below"; exit 1; }
          USERID=$(printf '%s' "$ROSTER" | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["id"])')
          # In production the seeded PIN is SEED_PIN, never the seed file's own (see seed.py).
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' -d "{\"user_id\":\"$USERID\",\"pin\":\"$SEED_PIN\"}")
          test "$code" = "200" || { echo "login smoke failed: HTTP $code"; exit 1; }
          echo "image smoke OK"

      # Browser-driven white-screen smoke against the SAME running production container.
      # Catches the catastrophic class the curl check can't see: a surface that throws on
      # mount, a wedged session, a build that loads blank.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6; pnpm from packageManager

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps (Playwright)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E smoke + field scenario (browser → running container)
        env:
          E2E_WORKFLOWS: 1
          E2E_BASE_URL: http://localhost:8000
          E2E_PIN: ${{ env.SEED_PIN }}  # the browser login needs the same PIN the seed used
          E2E_ADMIN_SECRET: ${{ env.ADMIN_SECRET }}  # unlocks /admin for the row-menu spec
          E2E_FLEET_SECRET: ${{ env.ALARM_WEBHOOK_SECRET }}  # parks the fake TLF (field scenario)
        run: pnpm exec playwright test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Every spec fails when the app reports a client error or a render storm (e2e/guard.ts).
      # The report is also ONE line in the container log — print those first, so a red run says
      # why without digging through the full log below.
      - name: Client errors reported by the app (on failure)
        if: failure()
        run: docker compose logs --no-color app | grep 'kpfront.clienterror' || echo "no client-error lines in the container log"

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # --- Performance: real user journeys, measured against a baseline -----------------------
  # The production container again (its own runner, in parallel with «Image»), and Chromium walking
  # what a crew does on a busy Einsatz: cold start through the kiosk, a reload of the installed app,
  # every surface four times, Linien and Absperrkreise, ten Meldungen, Funkkontakte, an idle minute.
  # Requests, bytes, writes, heap/DOM growth and interaction times are compared against
  # e2e/perf/baseline.json (scripts/perf-report.mjs, docs/testing/perf-journeys.md). A first run
  # that regresses gets a second one, and the verdict takes each number's best: noise only ever
  # makes a number worse, so a regression in both runs is real. The table lands in the job summary.
  perf:
    name: Performance (user journeys vs baseline)
    runs-on: ubuntu-latest
    env:
      SEED_PIN: '194731'   # the same throwaway values as «Image» — see the notes there
      ADMIN_SECRET: 'ci-only-admin-secret-not-a-credential'
      ALARM_WEBHOOK_SECRET: 'ci-only-fleet-secret-not-a-credential'
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and boot the production stack
        uses: ./.github/actions/stack

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6; pnpm from packageManager

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps (Playwright)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Performance journeys (browser → running container) + report
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_PIN: ${{ env.SEED_PIN }}
          PERF_JOURNEYS: '1'
        run: |
          set +e
          PERF_OUT=perf-results/run1 pnpm exec playwright test --project journeys
          walked=$?
          if [ "$walked" = 0 ] && ! node scripts/perf-report.mjs --summary /dev/null perf-results/run1 >/dev/null; then
            echo "::notice::a number regressed on the first run — walking the journeys a second time to confirm"
            PERF_OUT=perf-results/run2 pnpm exec playwright test --project journeys
            walked=$?
          fi
          node scripts/perf-report.mjs --summary perf-results/report.md perf-results/run*
          judged=$?
          [ "$walked" = 0 ] || echo "::error::a journey failed to walk — its numbers are missing from the report"
          [ "$walked" = 0 ] || printf '\n> [!WARNING]\n> A journey failed to walk, so its numbers are missing above. The Playwright report is in the run'"'"'s artifacts.\n' >> perf-results/report.md
          cat perf-results/report.md >> "$GITHUB_STEP_SUMMARY"
          # perf-comment.yml posts report.md on the PR; it runs with a write token this job never has
          echo "${{ github.event.pull_request.number }}" > perf-results/pr-number
          exit $(( walked || judged ))

      # `just perf-accept <run-id>` downloads this to make it the new baseline; perf-comment.yml
      # reads report.md + pr-number from it to post the table on the PR
      - name: Upload the numbers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-results
          path: perf-results/
          retention-days: 30

      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Client errors reported by the app (on failure)
        if: failure()
        run: docker compose logs --no-color app | grep 'kpfront.clienterror' || echo "no client-error lines in the container log"

      - name: Tear down
        if: always()
        run: docker compose down -v

  # --- Visual: screenshot regression tests against committed baselines ---------------------
  # Nine frozen states of the production container (Lage, Plan, Trupps, Verlauf, Rapport, kiosk;
  # tablet and phone, one night) compared pixel by pixel with e2e/visual/baseline/
  # (e2e/screens.visual.ts, docs/testing/visual-regression.md). It catches what no assertion
  # names: a merged visual pass that a later merge silently undid (#231). Its own runner, in
  # parallel with «Image» and «Performance», so it is never on the gate's critical path; not a
  # required check yet. A red run's verdict table is in the job summary; the pictures (expected,
  # actual, diff) are the `visual-results` artifact, and `just visual-accept <run-id>` takes its
  # actuals as the new baselines — for a deliberate change only, in its own commit.
  visual:
    name: Visual (screenshots vs baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEED_PIN: '194731'   # the same throwaway values as «Image» — see the notes there
      ADMIN_SECRET: 'ci-only-admin-secret-not-a-credential'
      ALARM_WEBHOOK_SECRET: 'ci-only-fleet-secret-not-a-credential'
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and boot the production stack
        uses: ./.github/actions/stack

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6; pnpm from packageManager

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps (Playwright)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Screenshots vs baseline (browser → running container) + report
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_PIN: ${{ env.SEED_PIN }}
          VISUAL: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: visual-results/report.json
        run: |
          set +e
          pnpm exec playwright test --project visual --reporter=list,json,html
          shot=$?
          node scripts/visual-report.mjs visual-results/report.json visual-results >> "$GITHUB_STEP_SUMMARY"
          exit $shot

      # expected / actual / diff per state, and the html report with its slider. `actual/` is what
      # `just visual-accept <run-id>` takes as the new baselines.
      - name: Upload the pictures (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-results
          path: |
            visual-results/
            playwright-report/
          retention-days: 14

      - name: Client errors reported by the app (on failure)
        if: failure()
        run: docker compose logs --no-color app | grep 'kpfront.clienterror' || echo "no client-error lines in the container log"

      - name: Tear down
        if: always()
        run: docker compose down -v
