<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=overlays-content (Android only; iOS ignores it): the keyboard slides
         OVER the app instead of shrinking the layout viewport. resizes-content reflowed the whole
         UI on every keyboard open/close — top bar, rails and map all jumped (28.08. field
         feedback), and the Atemschutz board reflow pushed the very field being edited off screen.
         Overlaying makes Android behave exactly like iOS, where all the keyboard handling this
         app has already lives: visualViewport pan + chrome pinning (lib/useViewportPan · --vv-pan)
         and keyboard-aware caps/lifts on the sheets that hold text (useKeyboardInset · --jc-kb). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="theme-color" content="#1b2330" />
    <meta name="description" content="Operative Lagekarte der Feuerwehr — Einsätze, Pläne, Fahrzeuge." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Installed-app feel on iOS/Android: launch standalone with our own home-screen label. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KP Front" />
    <!--
      No apple-mobile-web-app-status-bar-style here, deliberately. Letting the map run edge-to-edge
      under the iOS status bar needs `black-translucent`, and Apple stopped honouring that in
      iOS 26.1 (the value is deprecated with removal planned). Tried and reverted 2026-08-05: the
      tag was verifiably in the loaded document and iOS painted its opaque bar regardless.
      Consequence to know before writing layout code: in the installed iOS app the web view sits
      BELOW the status bar, so `env(safe-area-inset-top)` is always 0 there and the ~50pt at the
      top cannot be reclaimed. The bar takes its colour from the theme-color meta the boot script
      below keeps in sync with day/night, which is the best available outcome.
    -->
    <title>KP Front — Lagekarte</title>
    <!-- Fonts are self-hosted (see src/fonts.css) so they precache for offline cold-start. -->
    <!--
      Colour scheme BEFORE first paint. `html { background: var(--app-bg) }` resolves to the
      day value until main.tsx runs applyTheme(), so a night launch used to show a light screen
      for as long as the bundle took to parse — the one moment an operator is holding the tablet
      in the dark. The app records the scheme it last resolved (prefs.applyTheme), so this reads
      a decision rather than making one; with nothing recorded yet it asks the OS. Inline and
      synchronous on purpose: an external script would paint first and correct afterwards.
    -->
    <script>
      try {
        var t = localStorage.getItem('kp.theme.boot')
        if (t !== 'day' && t !== 'night') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day'
        }
        if (t === 'night') document.documentElement.dataset.theme = 'night'
        var m = document.querySelector('meta[name=theme-color]')
        if (m) m.setAttribute('content', t === 'night' ? '#0d1118' : '#eef3f7')
      } catch (e) { /* private mode / storage disabled — day default stands */ }
    </script>
    <!--
      Critical CSS for the static boot splash below (#root markup), so it renders correctly with
      ZERO external resources loaded — the one window where the real stylesheet (a <link>, hence
      async) cannot be trusted to have arrived: a cold cache, a stalled asset, or the offline
      first-load this splash exists for in the first place. Without this the same window showed
      an unstyled flash of raw German text on white.

      Same selectors as src/styles/08-toasts.css (.login/.boot-splash/.loading-card/.ping/
      .loading-stuck/.boot-hint) and src/styles/02-base.css (html background) on purpose: once
      the real stylesheet loads it sits AFTER this block in the cascade, so at equal specificity
      it simply wins and takes over — no !important tug-of-war, no double-maintenance beyond
      keeping the two copies' declarations in sync (a pointing comment sits at both). The theme
      read (data-theme, falling back to prefers-color-scheme) already happened above, before this
      block, so --ink/--accent/--app-bg below just resolve against whichever the script set —
      a night launch never paints the day gradient first.

      ⚠️ Same cascade trap 8b3de29 fixed: .loading-stuck.boot-hint must stay a compound selector
      (below the plain .loading-stuck rule) or a bare .boot-hint loses the cascade to the
      delay-less .loading-stuck fade. The 12s delay is deliberately exempt from reduced-motion —
      it IS the feature (a boot wedged before React can say so needs the wait, not an instant
      hint) — so reduced-motion re-asserts it with !important exactly as the real stylesheet does.
    -->
    <style>
      :root {
        --ease: cubic-bezier(.2, .7, .3, 1);
        --accent: #e8392b;
        --ink: #1b2330;
        --ink-dim: #4d586a;
        --border-soft: rgba(0, 0, 0, .06);
        --app-bg: radial-gradient(120% 90% at 50% -10%, #eef3f7 0%, #dfe6ec 45%, #d3dce4 100%);
      }
      :root[data-theme="night"] {
        --accent: #ff5a4d;
        --ink: #e8edf4;
        --ink-dim: #a4b0c2;
        --border-soft: rgba(255, 255, 255, .07);
        --app-bg: radial-gradient(120% 90% at 50% -10%, #1a2230 0%, #131922 45%, #0d1118 100%);
      }
      html, body { margin: 0; }
      html { background: var(--app-bg); }
      .login { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
        background: var(--app-bg); color: var(--ink); font-family: system-ui, sans-serif; }
      .boot-splash { animation: fade .3s var(--ease) .4s both; }
      .loading-card { display: flex; flex-direction: column; align-items: center; gap: 18px;
        animation: fade .3s var(--ease); }
      /* the snail loader needs no rules here: its animation rides in the SVG's own style block */
      .loading-stuck { display: flex; flex-direction: column; align-items: center; gap: 10px;
        max-width: 30ch; text-align: center; padding-top: 14px; border-top: 1px solid var(--border-soft); }
      .loading-stuck-title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
      .loading-stuck-hint { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--ink-dim); }
      .loading-stuck.boot-hint { animation: fade .3s var(--ease) 12s both; }
      @media (prefers-reduced-motion: reduce) {
        .loading-stuck.boot-hint { animation-delay: 12s !important; }
      }
      @keyframes fade { from { opacity: 0; } }
    </style>
  </head>
  <body>
    <!--
      Static boot splash. React's <Splash> cannot cover this window: it only exists once the
      bundle has parsed AND main.tsx's two budgeted awaits have settled (up to 4s each), and
      until then #root is empty — a blank screen with nothing to look at and nothing to tap.
      Reported from the field 2026-08-03 as "it looked broken for a few seconds".

      Same markup and classes as <Splash>, so React replacing this on mount is invisible. Styled
      TWICE on purpose: the real stylesheet is a <link> in <head>, which is async and cannot be
      trusted to have resolved yet — this is exactly the window a stalled asset or a cold cache
      shows up in — so the <style> block above this comment inlines the same rules to render
      correctly with zero external resources loaded, and the real stylesheet simply overrides it
      once it does arrive (see the pointing comments on both sides).
      No station wordmark here — that name comes from the deployment config, which is exactly
      what has not loaded yet, and a placeholder that changes would be worse than none.

      The .boot-hint block is CSS-only (fades in after 12 s, see .boot-hint in 08-toasts.css and
      its inline twin above): if the boot path wedges BEFORE React mounts — an IndexedDB open
      that never answers — this pulse would otherwise run forever with nothing to read and
      nothing to tap. React replaces the whole markup on mount, so a normal launch never shows
      it. German inline: the locale is a deployment setting that has not loaded at this point
      either.
    -->
    <div id="root">
      <div class="login splash boot-splash">
        <div class="loading-card">
          <!-- the «Heavy haul» snail — same markup as components/SnailLoader.tsx (keep in sync) -->
          <svg class="snail-loader" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 120" aria-hidden="true">
            <style>
              .snail-loader { width: 120px; height: auto; --sn-stalk: #231f20; }
              :root[data-theme="night"] .snail-loader { --sn-stalk: #fff0cf; filter: drop-shadow(0 0 5px rgba(255, 240, 207, .09)); }
              .snail-loader .sn-actor { transform-origin: 80px 100px; animation: sn-travel 3.6s cubic-bezier(.45,0,.3,1) infinite; }
              .snail-loader .sn-foot { transform-origin: 65px 100px; animation: sn-foot 3.6s ease-in-out infinite; }
              .snail-loader .sn-neck { transform-origin: 100px 96px; animation: sn-reach 3.6s cubic-bezier(.45,0,.3,1) infinite; }
              .snail-loader .sn-house { transform-origin: 65px 65px; animation: sn-house 3.6s cubic-bezier(.45,0,.3,1) infinite; }
              .snail-loader .sn-eye-back { transform-origin: 111px 58px; animation: sn-back 3.6s ease-in-out infinite; }
              .snail-loader .sn-eye-front { transform-origin: 120px 57px; animation: sn-front 3.6s ease-in-out infinite; }
              @keyframes sn-travel { 0%,45%,100% {transform:translateX(-5px)} 68%,78% {transform:translateX(5px)} }
              @keyframes sn-foot { 0%,100% {transform:scaleX(1)} 30%,49% {transform:scaleX(1.14)} 66% {transform:scaleX(.94)} 82% {transform:scaleX(1)} }
              @keyframes sn-reach { 0%,100% {transform:translate(0,0) rotate(0deg)} 24% {transform:translate(10px,0) rotate(13deg)} 37% {transform:translate(12px,2px) rotate(18deg)} 45% {transform:translate(10px,2px) rotate(15deg)} 51% {transform:translate(12px,1px) rotate(18deg)} 65% {transform:translate(7px,-2px) rotate(-3deg)} 78% {transform:translate(3px,0) rotate(2deg)} }
              @keyframes sn-house { 0%,100% {transform:translate(0,0) rotate(0deg)} 28%,44% {transform:translate(-7px,1px) rotate(-13deg)} 51% {transform:translate(-6px,0) rotate(-16deg)} 64% {transform:translate(11px,-6px) rotate(18deg)} 73% {transform:translate(7px,1px) rotate(7deg)} 82% {transform:translate(4px,0) rotate(4deg)} }
              @keyframes sn-back { 0%,100% {transform:rotate(0deg)} 23% {transform:rotate(-21deg)} 38%,49% {transform:rotate(18deg)} 63% {transform:rotate(0deg)} 77% {transform:rotate(7deg)} }
              @keyframes sn-front { 0%,100% {transform:rotate(0deg)} 18% {transform:rotate(21deg)} 37%,48% {transform:rotate(11deg)} 63% {transform:rotate(-29deg)} 79% {transform:rotate(10deg)} }
              @media (prefers-reduced-motion: reduce) { .snail-loader * { animation: none !important; } }
            </style>
            <g class="sn-actor">
              <g class="sn-foot"><path d="M23 93 Q41 81 70 87 Q94 82 117 89 Q132 96 143 98 Q147 104 138 105 H31 Q17 105 12 101 Q16 95 23 93Z" fill="#fff0cf" stroke="#231f20" stroke-width="4" stroke-linejoin="round"/></g>
              <g class="sn-neck">
                <path d="M91 94 Q104 83 102 66 Q101 51 113 50 Q127 49 127 65 Q126 80 119 94 Q112 102 98 100Z" fill="#fff0cf" stroke="#231f20" stroke-width="4"/>
                <g>
                  <g class="sn-eye-back"><path d="M111 58 Q109 44 102 36" fill="none" stroke="var(--sn-stalk, #231f20)" stroke-width="4" stroke-linecap="round"/><circle cx="102" cy="34" r="6.5" fill="#fff" stroke="#231f20" stroke-width="3"/><circle cx="104" cy="34" r="2.5" fill="#231f20"/></g>
                  <g class="sn-eye-front"><path d="M120 57 Q121 40 125 30" fill="none" stroke="var(--sn-stalk, #231f20)" stroke-width="4" stroke-linecap="round"/><circle cx="126" cy="28" r="7" fill="#fff" stroke="#231f20" stroke-width="3"/><circle cx="128" cy="28" r="2.8" fill="#231f20"/></g>
                </g>
                <path d="M116 71 Q122 76 126 70" fill="none" stroke="#231f20" stroke-width="2.7" stroke-linecap="round"/>
                <circle cx="111" cy="69" r="3" fill="#f2a900"/>
              </g>
              <g class="sn-house">
                <circle cx="65" cy="65" r="32" fill="var(--accent, #ee3523)" stroke="#231f20" stroke-width="4.5"/>
                <path d="M47 82 C27 63 43 38 65 42 C90 45 92 78 72 83 C54 89 43 68 53 57 C63 47 78 58 73 68 C69 77 58 72 62 65" fill="none" stroke="#231f20" stroke-width="4.5" stroke-linecap="round"/>
              </g>
            </g>
          </svg>
          <div class="loading-stuck boot-hint" role="status">
            <div class="loading-stuck-title">Start dauert länger als gewöhnlich</div>
            <p class="loading-stuck-hint">App schliessen und neu öffnen. Bleibt es dabei: die Website-Daten dieser App im Browser löschen – Einsätze liegen auf dem Server.</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
